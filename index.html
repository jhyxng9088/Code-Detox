<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f4f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Code Detox">
  <title>Code Detox</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <h1>Code Detox</h1>
      <p>우리 반 암호 변환기</p>
    </header>

    <section class="panel" aria-label="암호 변환기">
      <div class="segmented" role="tablist" aria-label="변환 방식">
        <button class="mode-btn" id="encryptMode" type="button" role="tab" aria-selected="false">암호화</button>
        <button class="mode-btn is-active" id="decryptMode" type="button" role="tab" aria-selected="true">해독</button>
      </div>

      <label class="field-label" for="inputText" id="inputLabel">암호문</label>
      <textarea id="inputText" rows="5" placeholder="해독할 암호를 입력하세요" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>

      <div class="result-head">
        <div>
          <span class="field-label">결과</span>
          <span class="count" id="resultCount" hidden></span>
        </div>
        <button class="text-btn" id="clearBtn" type="button">지우기</button>
      </div>

      <div class="result-box" id="resultBox" aria-live="polite">
        <p class="empty" id="emptyState">입력하면 바로 변환돼.</p>
        <div id="singleResult" hidden>
          <div class="single-result-row">
            <p id="singleResultText"></p>
            <button class="copy-btn" id="copySingle" type="button">복사</button>
          </div>
        </div>
        <div id="multiResult" hidden>
          <div class="multi-actions">
            <button class="copy-all-btn" id="copyAll" type="button">전체 복사</button>
          </div>
          <div class="candidate-list" id="candidateList"></div>
        </div>
      </div>
    </section>

    <p class="rule-note">초성만 한 칸 이동해. 된소리는 암호화할 때 예사소리로 바꾸고, 해독할 때 가능한 된소리 조합까지 전부 보여줘.</p>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite">복사했어</div>

  <script src="./app.js"></script>
</body>
</html>
